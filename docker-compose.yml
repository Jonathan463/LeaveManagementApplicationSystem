version: '3.8'

services:
  db:
    image: postgres:15
    container_name: leave_management_system_db
    environment:
      POSTGRES_USER: leave_management_system_user
      POSTGRES_PASSWORD: leave_management_system_password
      POSTGRES_DB: leave_management_system_db
    ports:
      - "5432:5432"
    volumes:
      - ./data/db:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leave_management_system_app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/leave_management_system_db
      SPRING_DATASOURCE_USERNAME: leave_management_system_user
      SPRING_DATASOURCE_PASSWORD: leave_management_system_password
    depends_on:
      - db
    ports:
      - "8080:8080"
